<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14e9f3"/><stop offset=".52" stop-color="#168dff"/><stop offset="1" stop-color="#8b4dff"/>
    </linearGradient>
    <linearGradient id="ribbon" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#a4fff0"/><stop offset=".24" stop-color="#16e3e9"/>
      <stop offset=".52" stop-color="#0877ff"/><stop offset=".78" stop-color="#3446f5"/>
      <stop offset="1" stop-color="#b34cff"/>
    </linearGradient>
    <linearGradient id="ribbonShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#09e9e9"/><stop offset=".48" stop-color="#087bff"/><stop offset="1" stop-color="#a334ff"/>
    </linearGradient>
    <linearGradient id="paper" x1=".15" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset=".56" stop-color="#e7f4ff"/><stop offset="1" stop-color="#a8caff"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#238dff"/><stop offset="1" stop-color="#6047ef"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#00dff4" stop-opacity=".24"/><stop offset="1" stop-color="#00dff4" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="28" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22" result="blur"/>
      <feOffset dy="18" result="offset"/><feComponentTransfer><feFuncA type="linear" slope=".42"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="paperShadow" x="-30%" y="-30%" width="170%" height="180%">
