name: Build Cairn Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cairn-windows-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-installer:
    name: Build Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build and package Cairn
        run: npm run build:desktop

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Cairn-Windows-EXE
          path: release/Cairn-Setup-*-x64.exe
          if-no-files-found: error
          retention-days: 14
